version: '3.8'

services:
  db:
    image: postgres:15-alpine
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-career_companion}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-career_companion_password}
      POSTGRES_DB: ${POSTGRES_DB:-career_companion_db}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - db_data:/var/lib/postgresql/data

volumes:
  db_data:
