name: Finish api-limits once (temporary)
# Commits the lock file on fix/api-limits and nothing else.
# Lives only on the throwaway branch tmp/api-limits-finish, which is deleted afterwards.
on:
  push:
    branches: [tmp/api-limits-finish]
permissions:
  contents: write
concurrency:
  group: finish-api-limits-once
  cancel-in-progress: false
jobs:
  finish:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: fix/api-limits
      - name: Check the commits on the branch
        run: |
          if [ "$(git rev-parse 'HEAD^{tree}')" != "3bb8a27549110c200d9a1e662c1d69a030a38186" ]; then
            echo "The commits on fix/api-limits do not match the reviewed files. Nothing was changed."
            exit 1
          fi
      - name: Make the reviewed change
        run: |
          git apply --unidiff-zero .lock-change.diff
          git rm -q -f .lock-change.diff
          git add -A
          if [ "$(git write-tree)" != "4abe4199d3174f0d66f70bd059ffb72af2681d81" ]; then
            echo "The result does not match the reviewed tree. Nothing was pushed."
            git status --short
            exit 1
          fi
      - name: Commit only the reviewed result
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'chore(security): package-lock.json for express-rate-limit'
          git push origin HEAD:fix/api-limits
