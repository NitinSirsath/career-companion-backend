name: Plain services once (temporary)
# Runs the one-time codemod on refactor/COM-155-plain-services and commits only its output.
# Lives only on the throwaway branch tmp/COM-155-plain-services, which is deleted afterwards.
on:
  push:
    branches: [tmp/COM-155-plain-services]
permissions:
  contents: write
concurrency:
  group: plain-services-once
  cancel-in-progress: false
jobs:
  convert:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PUPPETEER_SKIP_DOWNLOAD: 'true'
    steps:
      - uses: actions/checkout@v7
        with:
          ref: refactor/COM-155-plain-services
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run db:generate
      - name: Run the codemod from the temporary branch, then Prettier
        run: |
          git fetch --depth=1 origin tmp/COM-155-plain-services
          git show FETCH_HEAD:tmp/plain-services.cjs > "$RUNNER_TEMP/plain-services.cjs"
          node "$RUNNER_TEMP/plain-services.cjs"
          npm run format
      # Nothing is pushed unless the result compiles, lints and is formatted.
      - run: npm run typecheck && npm run lint && npm run format:check
      - name: Commit only the codemod output
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -u
          git commit -m 'refactor: services as plain exported functions (COM-155 step 2)'
          git push origin HEAD:refactor/COM-155-plain-services